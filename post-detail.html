<meta charset="UTF-8">

    <meta property="og:site_name" content="SS Joachim and Anne Catholic School">
    <meta property="og:title" content="Post Details | SS Joachim and Anne Catholic School">

    <meta property="og:image" content="https://ssja.onrender.com/images/school-building.png">
    <meta property="og:image:alt" content="SS Joachim and Anne Catholic School">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ssja.onrender.com/images/school-building.png">
    <meta property="og:url" content="https://ssja.onrender.com/post">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <style>
        .article-shell { max-width: 980px; margin: 0 auto; }
        .article-image { display: block; width: 100%; height: auto; max-height: none; object-fit: contain; border-radius: 18px; }
        .article-body { line-height: 1.9; color: #2c3e50; font-size: 1.05rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <header class="sticky-top">
    
    

<nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <img src="/images/logo.png" alt="School Logo" height="50">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="/academics">Academics</a></li>
                        <li class="nav-item"><a class="nav-link" href="/news">News &amp; Events</a></li>
                        <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5 bg-light">
        <div class="container article-shell">
            <a href="/news" class="btn btn-outline-primary btn-sm rounded-pill mb-4"><i class="fas fa-arrow-left me-2"></i>Back to News</a>
            <article id="postDetail" class="bg-white rounded shadow-sm p-4 p-md-5">
                <div class="text-center text-muted mb-3" id="postMeta">Loading...</div>
                <h1 id="postTitle" class="mb-4 text-center" style="color: var(--primary-color); font-weight:700;">Loading article...</h1>
                <div id="postImageWrap" class="mb-4"></div>
                <div id="postBody" class="article-body"></div>
            </article>
        </div>
    </main>

    <footer class="bg-dark text-white py-5 mt-auto">
        <div class="container text-center small">
            &copy; 2026 SS Joachim and Anne Catholic School. All Rights Reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadPostDetail() {
            const article = document.getElementById('postDetail');
            const titleEl = document.getElementById('postTitle');
            const metaEl = document.getElementById('postMeta');
            const imageWrap = document.getElementById('postImageWrap');
            const bodyEl = document.getElementById('postBody');

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>'"]/g, character => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[character]));
            }

            const pathParts = window.location.pathname.split('/');
            const postId = pathParts[pathParts.length - 1];

            try {
                const res = await fetch(`/api/posts/${postId}`);
                const result = await res.json();
                if (!res.ok || !result.success) {
                    throw new Error(result.error || 'Post not found');
                }

                const post = result.data || {};
                const catLabels = { news: 'News', blog: 'Blog', event: 'Event' };
                titleEl.textContent = post.title || 'Untitled article';
                document.title = `${post.title || 'Post Details'} | SS Joachim and Anne Catholic School`;
                const canonical = document.createElement('link');
                canonical.rel = 'canonical';
                canonical.href = window.location.origin + window.location.pathname;
                document.head.appendChild(canonical);
                document.querySelector('meta[property="og:title"]').setAttribute('content', document.title);
                document.querySelector('meta[property="og:url"]').setAttribute('content', canonical.href);
                const summary = (post.content || 'Read the latest school news and events from SS Joachim and Anne Catholic School.').replace(/\s+/g, ' ').trim().slice(0, 155);
                document.querySelector('meta[name="description"]').setAttribute('content', summary);
                document.querySelector('meta[property="og:description"]').setAttribute('content', summary);
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', document.title);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', summary);
                metaEl.innerHTML = `${post.date ? '<i class="far fa-calendar-alt me-1"></i>' + escapeHtml(post.date) : ''} ${post.author ? '<span class="ms-3"><i class="far fa-user me-1"></i>' + escapeHtml(post.author) + '</span>' : ''} <span class="badge bg-primary ms-2">${escapeHtml(catLabels[post.category] || 'News')}</span>`;

                if (post.image_path) {
                    const imagePath = post.image_path.startsWith('/') ? post.image_path : '/' + post.image_path;
                    imageWrap.innerHTML = `<img src="${escapeHtml(imagePath)}" alt="${escapeHtml(post.title || 'Article image')}" class="article-image shadow-sm mb-4">`;
                    document.querySelector('meta[property="og:image"]').setAttribute('content', window.location.origin + imagePath);
                    document.querySelector('meta[name="twitter:image"]').setAttribute('content', window.location.origin + imagePath);
                } else {
                    imageWrap.innerHTML = '';
                }

                bodyEl.textContent = post.content || '';
            } catch (error) {
                article.innerHTML = '<div class="text-center py-5 text-muted"><h3>Article not found</h3><p>The requested update could not be loaded.</p></div>';
                console.error(error);
            }
        }

        loadPostDetail();
    </script>
</body>
</html>
